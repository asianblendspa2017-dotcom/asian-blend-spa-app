<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asian Blend Spa</title>
<meta http-equiv="refresh" content="0; url=https://www.asianblendspa.com">
<link rel="canonical" href="https://www.asianblendspa.com/">
<style>
  body { font-family: system-ui, sans-serif; background: #0f332e; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 2rem; box-sizing: border-box; }
  a { color: #7fd8c8; }
</style>
</head>
<body>
<p>This app has been retired. Redirecting you to <a href="https://www.asianblendspa.com">www.asianblendspa.com</a>&hellip;</p>
<script>
// Unregister any previously installed app service worker and clear its caches.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => reg.unregister());
  });
}
if (window.caches) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}
location.replace("https://www.asianblendspa.com");
</script>
</body>
</html>
